<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 id="title">Tic Tac Toe</h1>
    </header>
    <main>
      <div id="gameInfo">
        <span class="score">
          <label for="x-score">X:</label>
          <span id="x-score">0</span>
        </span>
        <span class="score">
          <label for="o-score">O:</label>
          <span id="o-score">0</span>
        </span>
        <span class="score">
          <label for="tie">Tie:</label>
          <span id="tie">0</span>
        </span>
      </div>
      <div id="board"></div>
    </main>
    <footer></footer>
  </body>
</html>
